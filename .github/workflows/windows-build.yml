name: Windows build

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && pip install ".[dev,build]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build executable
        run: pyinstaller --clean --noconfirm packaging/chesscoach.spec
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path dist/ChessCoach/* -DestinationPath "dist/ChessCoach-${{ github.ref_name }}-windows-x64-portable.zip"
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install innosetup --no-progress -y
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          iscc "/DAppVersion=$version" packaging/ChessCoach.iss
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path)" } |
            Set-Content dist/SHA256SUMS.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chesscoach-windows-${{ github.run_number }}
          path: dist/**
