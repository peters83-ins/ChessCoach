name: Windows build

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && pip install ".[dev,build]"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $packageVersion = python -c "from chesscoach import __version__; print(__version__)"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion"
          }
      - name: Install pinned Stockfish for real tests
        shell: pwsh
        run: |
          $url = "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-windows-x86-64-universal.zip"
          $expected = "3c8bf1f9ea66a09350a40df4f632288285ac206d99f33ab5842c408fc30b48a7"
          $archive = Join-Path $env:RUNNER_TEMP "stockfish.zip"
          $folder = Join-Path $env:RUNNER_TEMP "stockfish"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw "Stockfish checksum verification failed"
          }
          Expand-Archive -Path $archive -DestinationPath $folder -Force
          $engine = Get-ChildItem $folder -Filter *.exe -Recurse |
            Where-Object { $_.Name -like 'stockfish-*.exe' } |
            Select-Object -First 1
          if ($null -eq $engine) { throw "Stockfish executable was not found in the archive" }
          "CHESSCOACH_TEST_STOCKFISH=$($engine.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_ci_tests.py -q
      - name: Build executable
        run: pyinstaller --clean --noconfirm packaging/chesscoach.spec
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path dist/ChessCoach/* -DestinationPath "dist/ChessCoach-${{ github.ref_name }}-windows-x64-portable.zip"
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install innosetup --no-progress -y
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          iscc "/DAppVersion=$version" packaging/ChessCoach.iss
      - name: Generate checksums
        shell: pwsh
        run: |
          $dist = (Resolve-Path dist).Path
          Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" -and $_.Name -ne "manifest.json" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              $relative = $_.Path.Substring($dist.Length + 1).Replace("\\", "/")
              "$($_.Hash.ToLowerInvariant())  $relative"
            } |
            Set-Content dist/SHA256SUMS.txt
      - name: Create release manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $installer = Get-ChildItem dist/installer -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Installer artifact was not found" }
          $portable = Get-ChildItem dist -Filter "*-portable.zip" | Select-Object -First 1
          if ($null -eq $portable) { throw "Portable artifact was not found" }
          python scripts/create_release_manifest.py `
            --version $version `
            --repository "${{ github.repository }}" `
            --tag "${{ github.ref_name }}" `
            --installer $installer.FullName `
            --portable $portable.FullName `
            --output dist/manifest.json
      - name: Include third-party notices
        shell: pwsh
        run: Copy-Item THIRD_PARTY.md dist/THIRD_PARTY.md
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: chesscoach-windows-${{ github.run_number }}
          path: dist/**
      - name: Explain manual build output
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: pwsh
        run: |
          @"
          This was an artifact-only build because the workflow ran from a branch or manual dispatch.
          To publish a GitHub Release, push a matching semantic version tag such as v0.1.0.
          Download the generated files from the Artifacts section of this run.
          "@ | Set-Content $env:GITHUB_STEP_SUMMARY
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            (Get-ChildItem dist/installer -Filter *.exe).FullName,
            (Get-ChildItem dist -Filter "*-portable.zip").FullName,
            (Resolve-Path dist/SHA256SUMS.txt).Path,
            (Resolve-Path dist/manifest.json).Path,
            (Resolve-Path dist/THIRD_PARTY.md).Path
          )
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --repo "${{ github.repository }}" --clobber $assets
          } else {
            gh release create $tag --repo "${{ github.repository }}" --title "Chess Coach $tag" --generate-notes $assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
