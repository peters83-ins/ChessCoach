[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chesscoach"
dynamic = ["version"]
description = "A local desktop chess trainer with independent chess, engine, and coaching layers"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "python-chess>=1.999,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ai = ["openai>=1.66,<4"]
build = ["pyinstaller>=6.0,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.13,<2", "openai>=1.66,<4"]

[project.scripts]
chesscoach = "chesscoach.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "chesscoach.__version__"}

[tool.setuptools.package-data]
chesscoach = ["courses/content/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_stockfish: tests that launch an installed Stockfish executable"]

[tool.coverage.run]
source = ["chesscoach"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
